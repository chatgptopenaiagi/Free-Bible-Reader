plugins { id 'com.android.application' }

android {
    namespace 'com.freebiblereader.voice.ro'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.freebiblereader.voice.ro'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters(*(project.findProperty('targetAbi') ?: 'arm64-v8a,x86_64').split(',')) }
        externalNativeBuild {
            cmake {
                arguments "-DFBR_WORKSPACE=${rootProject.projectDir.parentFile.absolutePath.replace('\\', '/')}"
                cppFlags '-std=c++17'
            }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    sourceSets.main.assets.srcDir '../../build-support/android-assets/voice-addon'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }
}
